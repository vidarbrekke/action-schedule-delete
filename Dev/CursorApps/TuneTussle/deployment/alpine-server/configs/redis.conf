# Redis configuration for TuneTussle Alpine Production Server
# Optimized for 1GB RAM server environment

# =============================================================================
# NETWORK & SECURITY
# =============================================================================
bind 127.0.0.1 ::1
port 6379
protected-mode yes
timeout 300

# =============================================================================
# MEMORY MANAGEMENT (1GB RAM Optimization)
# =============================================================================
maxmemory 128mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# =============================================================================
# PERSISTENCE CONFIGURATION
# =============================================================================
# Data directory - ensure this matches alpine-production.env
dir /data/redis

# RDB Persistence (snapshots)
save 900 1      # Save if at least 1 key changed in 900 seconds
save 300 10     # Save if at least 10 keys changed in 300 seconds  
save 60 10000   # Save if at least 10000 keys changed in 60 seconds

# RDB file settings
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# AOF Persistence (append-only file)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# =============================================================================
# LOGGING
# =============================================================================
loglevel notice
logfile /var/log/redis/redis.log
syslog-enabled yes
syslog-ident redis

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
# TCP settings
tcp-keepalive 300
tcp-backlog 511

# Database settings
databases 16
stop-writes-on-bgsave-error yes

# Memory optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# =============================================================================
# SECURITY
# =============================================================================
# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command EVAL ""
rename-command DEBUG ""
rename-command CONFIG ""

# Require authentication (uncomment and set password)
# requirepass your_secure_password_here

# =============================================================================
# SLOW LOG
# =============================================================================
slowlog-log-slower-than 10000
slowlog-max-len 128

# =============================================================================
# CLIENT SETTINGS
# =============================================================================
maxclients 10000
timeout 0

# =============================================================================
# ADVANCED CONFIG
# =============================================================================
supervised systemd
daemonize no
pidfile /var/run/redis/redis.pid

# Memory overcommit handling
vm-enabled no
activerehashing yes

# =============================================================================
# LATENCY MONITORING
# =============================================================================
latency-monitor-threshold 100

# =============================================================================
# NOTIFICATIONS (Optional - can be disabled to save memory)
# =============================================================================
notify-keyspace-events ""

# =============================================================================
# REPLICATION (Not needed for single server setup)
# =============================================================================
# Uncomment if setting up replication later
# replica-serve-stale-data yes
# replica-read-only yes 