name: CI

on:
  # TIMEOUT PROTECTION ADDED - Safe to re-enable
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Audit Backend Dependencies
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high
      
      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: dependency-check
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install Dependencies
        run: npm ci
        
      - name: Type Check
        run: npm run type-check
        
      - name: Run Tests
        timeout-minutes: 5
        run: npm test -- --forceExit --testTimeout=10000
        env:
          NODE_ENV: test
        
      - name: Test Coverage
        timeout-minutes: 3
        run: npm run test:coverage -- --forceExit --testTimeout=10000
        env:
          NODE_ENV: test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: dependency-check
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Dependencies
        run: npm ci
        
      - name: Lint Code
        run: npm run lint
        
      - name: Type Check & Build
        run: npm run build
        
      - name: Run Tests
        timeout-minutes: 5
        run: npm test

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci
        
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        
      - name: Start Backend & Test Health
        working-directory: backend
        run: |
          # Create minimal test env
          echo "OPENROUTER_API_KEY=test_key" > .env
          echo "MUSIC_PROVIDER=deezer" >> .env
          
          # Start backend in background
          npm run start:dev &
          BACKEND_PID=$!
          
          # Wait for server to start
          sleep 10
          
          # Test health endpoint
          curl -f http://localhost:4000/api/performance/health || exit 1
          
          # Cleanup
          kill $BACKEND_PID 