name: MANUAL DEPLOY ONLY - DO NOT AUTO-TRIGGER

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment test'

jobs:
  deploy-updates:
    name: Deploy Dependency Updates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install dependencies and build
        timeout-minutes: 5
        run: |
          echo "📦 Installing updated dependencies..."
          cd backend && npm ci
          cd ../frontend && npm ci
          
      - name: Run tests to verify updates
        timeout-minutes: 5
        continue-on-error: true
        run: |
          echo "🧪 Verifying all tests pass with updates..."
          cd backend && npm test -- --testTimeout=10000 --forceExit
          cd frontend && npm test -- --watchAll=false --testTimeout=10000
          
      - name: Build production backend
        timeout-minutes: 3
        run: |
          echo "🔨 Building backend for production..."
          cd backend && npm run build:prod
          
      - name: Build production frontend  
        timeout-minutes: 3
        run: |
          echo "🔨 Building frontend for production..."
          cd frontend && npm run build
          
      - name: Create deployment packages
        timeout-minutes: 2
        run: |
          echo "📦 Creating deployment packages..."
          cd backend && tar -czf ../backend-updated.tar.gz dist/
          cd ../frontend && tar -czf ../frontend-updated.tar.gz dist/
          
      - name: Deploy to server
        timeout-minutes: 5
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          echo "🚀 Deploying updated code to production..."
          
          # Setup SSH key with strict options
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # SSH options to prevent hanging
          SSH_OPTS="-p $SERVER_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          
          # Upload and deploy backend
          scp $SSH_OPTS backend-updated.tar.gz $SERVER_USER@$SERVER_HOST:/tmp/
          ssh $SSH_OPTS $SERVER_USER@$SERVER_HOST "
            cd /opt/tunetussle/current/backend &&
            sudo tar -xzf /tmp/backend-updated.tar.gz &&
            sudo chown -R appuser:appgroup dist/ &&
            sudo rc-service tunetussle restart
          "
          
          # Upload and deploy frontend
          scp $SSH_OPTS frontend-updated.tar.gz $SERVER_USER@$SERVER_HOST:/tmp/
          ssh $SSH_OPTS $SERVER_USER@$SERVER_HOST "
            cd /opt/tunetussle/current/frontend &&
            sudo tar -xzf /tmp/frontend-updated.tar.gz &&
            sudo chown -R www-data:www-data dist/ &&
            sudo rc-service caddy restart
          "
          
          echo "✅ Deployment complete!"
          
      - name: Cleanup
        timeout-minutes: 1
        run: |
          rm -f backend-updated.tar.gz frontend-updated.tar.gz
          rm -f ~/.ssh/deploy_key
          
      - name: Notify deployment success
        timeout-minutes: 1
        run: |
          echo "🎉 Automated dependency updates deployed successfully!"
          echo "📊 Server now running with latest patch updates" 